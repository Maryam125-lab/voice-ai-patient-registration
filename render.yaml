services:
  - type: web
    name: maryam-carecloud-voice-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maryam-carecloud-voice-ai-db
          property: connectionString
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

databases:
  - name: maryam-carecloud-voice-ai-db
    plan: free
    region: oregon
